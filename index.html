<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Star Wars Timeline Deck</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --void:#0A0E15;
  --hull:#111823;
  --hull-2:#161F2C;
  --edge:#26313F;
  --bone:#E9E5DA;
  --dim:#7B8899;

  --accent:#3F7FD1;          /* driven by era, set at runtime */
  --accent-soft:rgba(63,127,209,.16);

  --cardw:260px;
  --gap:28px;
  --step:288px;

  --ease:cubic-bezier(.22,1,.36,1);
  --dur:520ms;

  --f-display:"Big Shoulders Display","Haettenschweiler","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}
body{
  background:var(--void);
  color:var(--bone);
  font-family:var(--f-body);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ambient field — accent-tinted, shifts with era */
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(120% 70% at 50% 110%, var(--accent-soft), transparent 60%),
    radial-gradient(80% 50% at 50% -10%, rgba(255,255,255,.04), transparent 70%);
  transition:background 700ms linear;
  pointer-events:none;
}

/* ============================================================
   HEADER
   ============================================================ */
.deck-head{
  position:relative;z-index:3;
  display:flex;align-items:center;justify-content:space-between;
  gap:24px;flex-wrap:wrap;
  padding:16px 28px;
  border-bottom:1px solid var(--edge);
}
.wordmark{
  font-family:var(--f-display);
  font-size:22px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;
  line-height:1;
}
.wordmark span{color:var(--accent);transition:color 500ms linear}

.switches{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.seg{display:flex;border:1px solid var(--edge);border-radius:2px;overflow:hidden}
.seg button{
  appearance:none;background:transparent;border:0;
  color:var(--dim);
  font-family:var(--f-mono);font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;
  padding:9px 14px;cursor:pointer;
  transition:background 180ms,color 180ms;
}
.seg button + button{border-left:1px solid var(--edge)}
.seg button:hover{color:var(--bone);background:var(--hull-2)}
.seg button[aria-pressed="true"]{color:var(--void);background:var(--accent)}
.seg button:focus-visible{outline:2px solid var(--bone);outline-offset:-2px}

.ghost-btn{
  appearance:none;background:transparent;
  border:1px solid var(--edge);border-radius:2px;
  color:var(--dim);
  font-family:var(--f-mono);font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;
  padding:9px 14px;cursor:pointer;
  transition:color 180ms,border-color 180ms;
}
.ghost-btn:hover{color:var(--bone);border-color:var(--bone)}
.ghost-btn:focus-visible{outline:2px solid var(--bone);outline-offset:2px}

/* ============================================================
   STAGE
   ============================================================ */
.stage{
  position:relative;z-index:2;
  flex:1;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;
  padding:24px 0 8px;
}

.rail-window{
  position:relative;
  width:100%;
  height:calc(var(--cardw) * 1.5 + 40px);
  overflow:hidden;
  /* feathered edges so off-screen cards fade instead of clipping */
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
}
.rail{
  position:absolute;top:20px;left:50%;
  display:flex;gap:var(--gap);
  transform:translateX(calc(-1 * (var(--i,0) * var(--step) + var(--cardw)/2)));
  transition:transform var(--dur) var(--ease);
  will-change:transform;
}

.card{
  position:relative;
  flex:0 0 var(--cardw);
  width:var(--cardw);
  aspect-ratio:2/3;
  border:1px solid var(--edge);
  border-radius:3px;
  overflow:hidden;
  background:var(--hull);
  opacity:.30;
  transform:scale(.82);
  filter:saturate(.35);
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),
             filter var(--dur) var(--ease),border-color var(--dur) linear,
             box-shadow var(--dur) linear;
  cursor:pointer;
}
.card.is-active{
  opacity:1;
  transform:scale(1.06);
  filter:none;
  border-color:var(--card-hue);
  box-shadow:0 0 0 1px var(--card-hue),0 24px 60px -20px var(--card-hue);
}
/* unread books stay in the dimmed, desaturated "off-screen" look even when centered */
.card.unread,
.card.is-active.unread{
  opacity:.30;
  transform:scale(.82);
  filter:saturate(.35);
  border-color:var(--edge);
  box-shadow:none;
}

/* procedural placeholder art */
.art{
  position:absolute;inset:0;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:18px 16px;
  background:
    linear-gradient(180deg,rgba(0,0,0,.10) 0%,rgba(0,0,0,.72) 100%),
    linear-gradient(150deg,var(--card-hue) 0%,rgba(0,0,0,0) 62%),
    repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 1px,transparent 1px 9px),
    var(--hull-2);
}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* real posters carry their own title — drop the placeholder overlay */
.art.has-cover > :not(img){display:none}
/* square or wide box art (handheld, CD, SNES): show it whole over a blurred copy */
.art img.cover-bg{display:none}
.art.fit img.cover-bg{display:block;filter:blur(16px) brightness(.5) saturate(1.2);transform:scale(1.25)}
.art.fit img.cover{object-fit:contain}
.art .glyph{
  position:absolute;top:14px;right:14px;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;
  color:rgba(233,229,218,.72);
}
.art .years{
  position:absolute;top:14px;left:14px;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;
  color:rgba(233,229,218,.72);
}
.art .name{
  position:relative;
  font-family:var(--f-display);font-weight:800;font-size:30px;line-height:.92;
  letter-spacing:.01em;text-transform:uppercase;
  text-wrap:balance;
}
.art .rule{position:relative;height:2px;background:var(--card-hue);width:38px;margin-bottom:10px}

.card.drop-target{border-color:var(--bone);box-shadow:0 0 0 2px var(--bone)}

[hidden]{display:none!important}

/* ============================================================
   GAMES — sub-tabs, reference panels, readout extras
   ============================================================ */
.subnav{
  position:relative;z-index:3;
  display:flex;flex-wrap:wrap;gap:4px;
  padding:0 28px;border-bottom:1px solid var(--edge);
}
.subnav button{
  appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);
  font-family:var(--f-mono);font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;
  padding:11px 12px 9px;cursor:pointer;
  transition:color 180ms,border-color 400ms linear;
}
.subnav button:hover{color:var(--bone)}
.subnav button[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--accent)}
.subnav button b{color:var(--dim);font-weight:500;margin-left:6px}
.subnav button:focus-visible{outline:2px solid var(--bone);outline-offset:-2px}

.panel{flex:1;min-height:0;width:100%;overflow-y:auto;padding:28px 28px 48px}
.panel-inner{max-width:1100px;margin:0 auto;display:grid;gap:16px}
.panel h2{
  font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.2vw,46px);
  line-height:.95;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;
}
.panel h3{
  margin-top:14px;font-family:var(--f-mono);font-size:11px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
}
.panel .lede{color:var(--dim);font-size:14px;line-height:1.55;max-width:66ch}
.ref-list{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));column-gap:32px}
.ref-list li{border-top:1px solid var(--edge);padding:11px 0;display:grid;gap:4px}
.ref-list strong{font-weight:500;font-size:14px}
.ref-list span{font-family:var(--f-mono);font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.chips li{font-family:var(--f-mono);font-size:12px;border:1px dashed var(--edge);border-radius:2px;padding:7px 10px}
.chips li span{color:var(--dim);margin-left:6px}
.notes-list{list-style:none;display:grid;gap:12px;max-width:72ch;font-size:14px;line-height:1.55;color:#C4C8CC}
.notes-list b{color:var(--bone);font-weight:600}
.sources{display:grid;gap:6px;padding-left:1.2em;font-size:13px;color:var(--dim)}
.sources a{color:var(--accent);text-underline-offset:3px}

body:not(.games-panel) .panel{display:none}
body.games-panel .rail-window,
body.games-panel .readout,
body.games-panel .transport,
body.games-panel .hint,
body.games-panel #modeSeg{display:none}
body.games-panel .stage{justify-content:flex-start;padding:0}

.cast{font-size:13px;line-height:1.45;color:var(--bone);opacity:.88;max-width:70ch}
.cast span{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-right:8px;
}
.cast:empty,.systems:empty{display:none}
.systems{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:720px}
.systems li{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);
  border:1px solid var(--edge);border-radius:2px;padding:3px 6px;
}
.flag.quiet{border-color:var(--edge);color:var(--bone)}
.flag.off{border-color:#C4453C;color:#E07A6E}

/* ============================================================
   READOUT
   ============================================================ */
.readout{
  width:min(760px,90vw);
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.readout.swap{animation:swap 420ms var(--ease)}
@keyframes swap{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
.era-tag{
  font-family:var(--f-mono);font-size:11px;font-weight:600;
  letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent);
  transition:color 400ms linear;
}
.title{
  font-family:var(--f-display);font-weight:800;
  font-size:clamp(34px,6vw,66px);line-height:.9;
  letter-spacing:.005em;text-transform:uppercase;
  text-wrap:balance;
}
.meta{
  display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;
  color:var(--dim);text-transform:uppercase;
}
.meta b{color:var(--bone);font-weight:500}
.meta .sep{width:4px;height:4px;background:var(--edge);border-radius:50%}
.flag{
  border:1px solid var(--accent);color:var(--accent);
  padding:2px 7px;border-radius:2px;font-size:10px;letter-spacing:.16em;
}
.note{
  font-size:13px;line-height:1.5;color:var(--dim);
  max-width:60ch;
}
.read-check{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--f-mono);font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  transition:color 180ms;
}
.read-check input{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:pointer}
.read-check:hover{color:var(--bone)}

/* ============================================================
   SCRUBBER
   ============================================================ */
.transport{
  position:relative;z-index:3;
  border-top:1px solid var(--edge);
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.45));
  padding:14px 28px 18px;
  display:flex;align-items:center;gap:20px;
}

.step-btn{
  appearance:none;flex:0 0 auto;
  width:44px;height:44px;
  background:var(--hull);border:1px solid var(--edge);border-radius:2px;
  color:var(--bone);font-size:15px;cursor:pointer;
  display:grid;place-items:center;
  transition:background 180ms,border-color 180ms,transform 180ms var(--ease);
}
.step-btn:hover{background:var(--hull-2);border-color:var(--accent)}
.step-btn:active{transform:scale(.94)}
.step-btn:disabled{opacity:.28;cursor:default;transform:none}
.step-btn:focus-visible{outline:2px solid var(--bone);outline-offset:2px}

.strip{
  position:relative;flex:1;height:52px;
  cursor:ew-resize;touch-action:none;
}
.strip::after{
  content:"";position:absolute;left:0;right:0;top:26px;height:1px;
  background:var(--edge);
}
.strip:focus-visible{outline:1px solid var(--bone);outline-offset:6px}

.tick{
  position:absolute;top:18px;
  width:2px;height:16px;margin-left:-1px;
  background:var(--dim);opacity:.42;
  transition:left 760ms var(--ease),height 300ms var(--ease),
             opacity 300ms linear,background 300ms linear,top 300ms var(--ease);
  pointer-events:none;
}
.tick.is-active{
  top:10px;height:32px;width:3px;
  background:var(--accent);opacity:1;
}
.tick.is-major{opacity:.7}

.strip-label{
  position:absolute;top:44px;
  transform:translateX(-50%);
  font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;
  color:var(--dim);white-space:nowrap;pointer-events:none;
  transition:left 760ms var(--ease);
}

.counter{
  flex:0 0 auto;
  font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;
  color:var(--dim);
}
.counter b{color:var(--bone);font-weight:600}

.hint{
  position:relative;z-index:3;
  padding:0 28px 12px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  color:#4E5A6B;text-transform:uppercase;text-align:center;
}

/* ============================================================
   CLEAN VIEW — for recording
   ============================================================ */
body.clean .deck-head,
body.clean .hint,
body.clean .note,
body.clean .subnav{display:none}
body.clean .transport{border-top-color:transparent;background:none}
body.clean .rail-window{height:calc(var(--cardw) * 1.5 + 60px)}

/* the only control left in clean view: faint enough to stay out of a recording */
.exit-clean{
  display:none;position:fixed;top:12px;right:12px;z-index:10;
  width:32px;height:32px;border-radius:50%;
  border:1px solid var(--edge);background:rgba(10,14,21,.6);
  color:var(--dim);font-size:13px;line-height:1;cursor:pointer;
  opacity:.3;transition:opacity 200ms,color 200ms,border-color 200ms;
}
body.clean .exit-clean{display:grid;place-items:center}
.exit-clean:hover,.exit-clean:focus-visible{opacity:1;color:var(--bone);border-color:var(--bone);outline:none}
@media (hover:none){.exit-clean{opacity:.5}}

/* ============================================================
   RESPONSIVE / MOTION
   ============================================================ */
.hint .touch{display:none}
@media (hover:none) and (pointer:coarse){
  .hint .desk{display:none}
  .hint .touch{display:inline}
}

@media (max-width:820px){
  :root{--cardw:170px;--gap:18px;--step:188px}
  /* phones scroll instead of squeezing everything into one screen */
  html,body{height:auto}
  body{overflow-x:hidden;overflow-y:auto;min-height:100%}
  .stage{flex:none;justify-content:flex-start;gap:18px;padding:16px 0 20px}
  .rail-window{flex-shrink:0;touch-action:pan-y}
  .readout{width:100%;padding-inline:16px}

  .deck-head{padding:12px 16px;gap:10px}
  .wordmark{font-size:20px}
  .switches{width:100%;gap:8px}
  .seg button,.ghost-btn{padding:10px 10px;letter-spacing:.08em}
  #trackSeg{flex-basis:100%;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--edge)}
  #trackSeg button{border-left:0;background:var(--void)}
  #trackSeg button[aria-pressed="true"]{background:var(--accent)}
  #modeSeg{flex:1}
  #modeSeg button{flex:1}
  .long{display:none}

  .subnav{padding:0 16px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .subnav::-webkit-scrollbar{display:none}
  .subnav button{flex:none;white-space:nowrap}

  /* scrubber stays under the thumb while the readout scrolls */
  .transport{position:sticky;bottom:0;background:var(--void);padding:10px 16px 12px;gap:10px}
  .step-btn{width:40px;height:40px}
  .counter{font-size:12px}
  .strip-label{font-size:9px;letter-spacing:.02em;max-width:48%;overflow:hidden;text-overflow:ellipsis}

  .art .name{font-size:19px}
  .panel{flex:none;overflow:visible;padding:22px 16px 40px}
}
/* short desktop windows: shrink the rail so the readout (games add cast + systems) clears the scrubber */
@media (min-width:821px) and (max-height:920px){
  :root{--cardw:220px;--step:248px}
  .stage{gap:16px}
  .art .name{font-size:26px}
}
@media (min-width:821px) and (max-height:800px){
  :root{--cardw:180px;--step:208px}
  .art .name{font-size:22px}
}
@media (min-width:821px) and (max-height:680px){
  :root{--cardw:150px;--step:178px}
  .art .name{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:1ms!important;animation-duration:1ms!important}
}
</style>
</head>
<body>

<header class="deck-head">
  <div class="wordmark">Timeline <span>Deck</span></div>
  <div class="switches">
    <div class="seg" id="trackSeg" role="group" aria-label="Collection">
      <button data-track="screen"  aria-pressed="true">On screen</button>
      <button data-track="books"   aria-pressed="false">Canon books</button>
      <button data-track="legends" aria-pressed="false">Legends &amp; Visions</button>
      <button data-track="games"   aria-pressed="false">Games</button>
    </div>
    <div class="seg" id="modeSeg" role="group" aria-label="Order">
      <button data-mode="timeline" aria-pressed="true">BBY / ABY<span class="long"> order</span></button>
      <button data-mode="release"  aria-pressed="false">Release<span class="long"> order</span></button>
    </div>
    <button class="ghost-btn" id="cleanBtn" aria-pressed="false">Clean view</button>
  </div>
</header>

<button class="exit-clean" id="exitClean" aria-label="Exit clean view" title="Exit clean view (Esc)">&#10005;</button>

<nav class="subnav" id="gameNav" role="tablist" aria-label="Games" hidden>
  <button role="tab" data-view="timeline"  aria-selected="true">Timeline <b id="gnTimeline"></b></button>
  <button role="tab" data-view="other"     aria-selected="false">Not on the timeline <b id="gnOther"></b></button>
  <button role="tab" data-view="cancelled" aria-selected="false">Cancelled <b id="gnCancelled"></b></button>
  <button role="tab" data-view="notes"     aria-selected="false">Notes &amp; sources</button>
</nav>

<main class="stage">
  <div class="rail-window">
    <div class="rail" id="rail"></div>
  </div>

  <div class="readout" id="readout" aria-live="polite">
    <div class="era-tag" id="era"></div>
    <h1 class="title" id="title"></h1>
    <div class="meta" id="meta"></div>
    <label class="read-check" id="readWrap" hidden><input type="checkbox" id="readInput"> I&rsquo;ve read this</label>
    <p class="note" id="note"></p>
    <p class="cast" id="cast"></p>
    <ul class="systems" id="systems"></ul>
  </div>

  <section class="panel" id="gamePanel"></section>
</main>

<div class="transport">
  <button class="step-btn" id="prevBtn" aria-label="Previous title">&#9664;</button>
  <div class="strip" id="strip" role="slider" tabindex="0"
       aria-label="Timeline position" aria-valuemin="1" aria-valuenow="1" aria-valuemax="1"></div>
  <button class="step-btn" id="nextBtn" aria-label="Next title">&#9654;</button>
  <div class="counter" id="counter"></div>
</div>

<p class="hint"><span class="desk">Drag the strip or use &larr; &rarr; &middot; Drop an image on the centre card to set its cover &middot; C for clean view</span><span class="touch">Swipe the cards or drag the strip</span></p>

<script>
/* ============================================================
   COVER ART
   Drop an image file onto the centre card to load it for this
   session, or fill in permanent paths here — key = id below.
   e.g. "a-new-hope": "art/anh.jpg"
   ============================================================ */
const COVERS = {
  "dawn-of-the-jedi": "covers/dawn-of-the-jedi.webp",
  "young-jedi-adventures": "covers/young-jedi-adventures.webp",
  "the-acolyte": "covers/the-acolyte.webp",
  "tales-of-the-jedi": "covers/tales-of-the-jedi.webp",
  "the-phantom-menace": "covers/the-phantom-menace.webp",
  "attack-of-the-clones": "covers/attack-of-the-clones.webp",
  "the-clone-wars": "covers/the-clone-wars.webp",

/* ============================================================
   READ TRACKING — canon books only. The original eight Thrawn /
   Tarkin / Dark Disciple titles start marked read; every book added
   after that starts unread until checked off. This is a static,
   backend-less page, so state is kept in this browser's localStorage
   only — it won't follow you to a different browser or device.
   ============================================================ */
const DEFAULT_READ_IDS = new Set([
  "dark-disciple", "ta-chaos-rising", "ta-greater-good", "ta-lesser-evil",
  "tarkin", "thrawn", "thrawn-alliances", "thrawn-treason",
  "dooku-jedi-lost", "master-and-apprentice", "alphabet-squadron",
  "master-of-evil", "the-mask-of-fear"
]);
const READS_KEY = "sw-deck-books-read-v1";
let READS = {};
try { READS = JSON.parse(localStorage.getItem(READS_KEY) || "{}"); } catch(e) { READS = {}; }
function isRead(id){
  return Object.prototype.hasOwnProperty.call(READS, id) ? READS[id] : DEFAULT_READ_IDS.has(id);
}
function saveReads(){
  try { localStorage.setItem(READS_KEY, JSON.stringify(READS)); } catch(e) {}
}

/* ============================================================
   ERAS — the accent colour is derived from where you are standing
   ============================================================ */
const ERAS = [
  {max:-5000, name:"Dawn of the Jedi",        hue:"#7E6BD1"},
  {max:-400,  name:"Old Republic",            hue:"#9A5CC0"},
  {max:-100,  name:"High Republic",           hue:"#D9B45B"},
  {max:-18.9, name:"Fall of the Jedi",        hue:"#C0763A"},
  {max:-5,    name:"Reign of the Empire",     hue:"#C4453C"},
  {max:4.5,   name:"Age of Rebellion",        hue:"#3F7FD1"},
  {max:33.5,  name:"New Republic",            hue:"#35A38B"},
  {max:36,    name:"Rise of the First Order", hue:"#C93C5B"},
  {max:Infinity, name:"New Jedi Order",       hue:"#8FB8D9"}
];
const NO_ERA = {name:"Outside the timeline", hue:"#9AA4B2"};

function eraOf(item){
  if(item.t === null) return NO_ERA;
  return ERAS.find(e => item.t < e.max) || ERAS[ERAS.length-1];
}

const GLYPH = {Film:"◈ FILM", Films:"◈ FILMS", Series:"▤ SERIES", Novel:"▣ NOVEL", Legends:"▣ LEGENDS", Anthology:"▤ SHORTS", Game:"▦ GAME"};

/* ============================================================
   STATE
   ============================================================ */
let track = "screen";
let mode  = "timeline";
let index = 0;
let list  = [];

const $ = id => document.getElementById(id);
const rail = $("rail"), strip = $("strip");

/* signed log keeps 25,000 BBY and 9 ABY on the same strip */
const compress = t => Math.sign(t) * Math.log10(1 + Math.abs(t));

function sortList(){
  const arr = DATA.filter(d => d.track === track);
  arr.sort((a,b) => mode === "release"
    ? (a.ry - b.ry) || (a.t ?? 1e9) - (b.t ?? 1e9)
    : ((a.t ?? 1e9) - (b.t ?? 1e9)) || (a.ry - b.ry));
  return arr;
}

/* position 0–100 along the strip, spaced by real distance */
function positions(){
  const vals = list.map(d => mode === "release"
    ? (d.ry === 9999 ? null : d.ry)
    : (d.t === null ? null : compress(d.t)));
  const known = vals.filter(v => v !== null);
  const lo = Math.min(...known), hi = Math.max(...known);
  const span = (hi - lo) || 1;
  const pos = vals.map(v => v === null ? 100 : 2 + ((v - lo) / span) * 96);

  /* titles sharing a year would stack into one tick — fan them apart
     just enough that each stays individually grabbable */
  for(let i = 1; i < pos.length; i++){
    if(pos[i] - pos[i-1] < 0.6) pos[i] = pos[i-1] + 0.6;
  }
  const over = pos[pos.length-1] - 99;
  if(over > 0) for(let i = 0; i < pos.length; i++) pos[i] -= over * (i / (pos.length-1));
  return pos;
}

/* ============================================================
   RENDER
   ============================================================ */
/* cover images: near-2:3 art fills the card; anything squarer or wider is shown whole */
const coverImgs = src => `<img class="cover-bg" alt="" src="${src}"><img class="cover" alt="" src="${src}">`;
function watchFit(art){
  const img = art && art.querySelector("img.cover");
  if(!img) return;
  const check = () => {
    const r = img.naturalWidth / img.naturalHeight;
    art.classList.toggle("fit", r > 0.85 || r < 0.5);
  };
  if(img.complete && img.naturalWidth) check();
  else img.addEventListener("load", check, {once:true});
}

function buildRail(){
  rail.innerHTML = "";
  list.forEach((d,i) => {
    const era = eraOf(d);
    const card = document.createElement("div");
    card.className = "card" + (d.track === "books" && !isRead(d.id) ? " unread" : "");
    card.style.setProperty("--card-hue", era.hue);
    card.dataset.i = i;
    const src = COVERS[d.id];
    card.innerHTML = `
      <div class="art${src ? " has-cover" : ""}">
        ${src ? coverImgs(src) : ""}
        <span class="years">${mode === "release" ? d.rel : d.when}</span>
        <span class="glyph">${GLYPH[d.medium] || d.medium}</span>
        <div class="rule"></div>
        <div class="name">${d.title}</div>
      </div>`;
    watchFit(card.querySelector(".art"));
    card.addEventListener("click", () => go(i));
    enableDrop(card, d);
    rail.appendChild(card);
  });
}

/* Ticks are keyed to the title, not to a slot. Switching order therefore
   slides every tick to its new spacing — the two orders are visibly
   different distributions of the same set. */
const tickEls = new Map();

function buildTicks(){
  strip.querySelectorAll(".tick,.strip-label").forEach(n => n.remove());
  tickEls.clear();
  list.forEach(d => {
    const tk = document.createElement("i");
    tk.className = "tick";
    strip.appendChild(tk);
    tickEls.set(d.id, tk);
  });
  const lo = document.createElement("span"), hi = document.createElement("span");
  lo.className = hi.className = "strip-label";
  lo.id = "stripLo"; hi.id = "stripHi";
  lo.style.left = "0%"; lo.style.transform = "none";
  hi.style.left = "100%"; hi.style.transform = "translateX(-100%)";
  strip.append(lo, hi);
  layoutTicks();
}

function layoutTicks(){
  const pos = positions();
  list.forEach((d,i) => {
    const tk = tickEls.get(d.id);
    if(tk) tk.style.left = pos[i] + "%";
  });
  $("stripLo").textContent = mode === "release" ? list[0].rel : list[0].when;
  $("stripHi").textContent = mode === "release"
    ? list[list.length-1].rel : list[list.length-1].when;
}

function update(animateReadout = true){
  const d = list[index], era = eraOf(d);

  document.documentElement.style.setProperty("--accent", era.hue);
  document.documentElement.style.setProperty("--accent-soft", era.hue + "28");

  rail.style.setProperty("--i", index);
  [...rail.children].forEach((c,i) => c.classList.toggle("is-active", i === index));
  tickEls.forEach((tk,id) => tk.classList.toggle("is-active", id === d.id));

  $("era").textContent = era.name;
  $("title").textContent = d.title;
  $("meta").innerHTML = `
    <b>${d.when}</b><span class="sep"></span>
    <span>${d.medium}</span><span class="sep"></span>
    ${d.author ? `<span>${d.author}</span><span class="sep"></span>` : ""}
    <span>Released ${d.rel}</span>
    ${d.soon ? `<span class="flag">Upcoming</span>` : ""}
    ${d.cont ? `<span class="flag quiet">${d.cont}</span>` : ""}
    ${d.kind === "retelling" ? `<span class="flag quiet">Film retelling</span>` : ""}
    ${d.kind === "multiplayer" ? `<span class="flag quiet">Multiplayer</span>` : ""}
    ${d.offline ? `<span class="flag off">Offline · ${d.offline}</span>` : ""}`;
  $("note").textContent = d.note || "";
  $("cast").innerHTML = d.chars ? `<span>Cast</span>${d.chars}` : "";
  $("systems").innerHTML = d.sys ? d.sys.map(s => `<li>${s}</li>`).join("") : "";

  $("readWrap").hidden = d.track !== "books";
  if(d.track === "books") $("readInput").checked = isRead(d.id);
  $("counter").innerHTML = `<b>${String(index+1).padStart(2,"0")}</b> / ${String(list.length).padStart(2,"0")}`;

  $("prevBtn").disabled = index === 0;
  $("nextBtn").disabled = index === list.length - 1;
  strip.setAttribute("aria-valuenow", index + 1);
  strip.setAttribute("aria-valuemax", list.length);
  strip.setAttribute("aria-valuetext", `${d.title}, ${d.when}`);

  if(animateReadout){
    const r = $("readout");
    r.classList.remove("swap"); void r.offsetWidth; r.classList.add("swap");
  }
}

function resolve(keepId){
  list = sortList();
  const found = keepId ? list.findIndex(d => d.id === keepId) : -1;
  index = found > -1 ? found : Math.min(index, list.length - 1);
}

/* new collection: everything is replaced */
function rebuild(keepId){
  resolve(keepId);
  buildRail(); buildTicks(); update();
}

/* same collection, new order: cards cut, ticks slide */
function reorder(keepId){
  const win = document.querySelector(".rail-window");
  win.style.transition = "opacity 150ms linear";
  win.style.opacity = "0";
  setTimeout(() => {
    resolve(keepId);
    buildRail(); layoutTicks(); update(false);
    rail.style.transition = "none";
    requestAnimationFrame(() => {
      rail.style.transition = "";
      win.style.opacity = "1";
    });
  }, 150);
}

function go(i){
  const n = Math.max(0, Math.min(list.length - 1, i));
  if(n === index) return;
  index = n; update();
}

/* ============================================================
   INPUT
   ============================================================ */
$("prevBtn").addEventListener("click", () => go(index - 1));
$("nextBtn").addEventListener("click", () => go(index + 1));

$("trackSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  track = b.dataset.track; index = 0;
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  $("gameNav").hidden = track !== "games";
  setGameView("timeline");
  rebuild();
});

$("modeSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.mode === mode) return;
  const keep = list[index].id;
  mode = b.dataset.mode;
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  reorder(keep);
});

$("readInput").addEventListener("change", e => {
  const d = list[index];
  if(!d || d.track !== "books") return;
  READS[d.id] = e.target.checked;
  const card = rail.children[index];
  if(card) card.classList.toggle("unread", !e.target.checked);
  saveReads();
});

$("cleanBtn").addEventListener("click", () => {
  const on = document.body.classList.toggle("clean");
  $("cleanBtn").setAttribute("aria-pressed", on);
  /* never park focus on the exit button when entering — a focus ring would show in the recording */
  if(on && document.activeElement === $("cleanBtn")) $("cleanBtn").blur();
  if(!on && document.activeElement === $("exitClean")) $("cleanBtn").focus({preventScroll:true});
});
$("exitClean").addEventListener("click", () => $("cleanBtn").click());

/* swipe the card rail on touch screens */
const railWin = document.querySelector(".rail-window");
let swipe = null, lastSwipe = 0;
railWin.addEventListener("pointerdown", e => {
  if(e.pointerType !== "mouse") swipe = {x:e.clientX, y:e.clientY};
});
railWin.addEventListener("pointerup", e => {
  if(!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if(Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
  const step = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--step")) || 188;
  go(index - Math.sign(dx) * Math.max(1, Math.round(Math.abs(dx) / step)));
  lastSwipe = Date.now();
});
railWin.addEventListener("pointercancel", () => swipe = null);
/* a swipe that ends on a card is not also a tap on that card */
railWin.addEventListener("click", e => { if(Date.now() - lastSwipe < 400) e.stopPropagation(); }, true);

/* drag the strip, snap to the nearest title */
let dragging = false;
function pick(clientX){
  const box = strip.getBoundingClientRect();
  const pct = ((clientX - box.left) / box.width) * 100;
  const pos = positions();
  let best = 0, bestD = Infinity;
  pos.forEach((p,i) => { const dd = Math.abs(p - pct); if(dd < bestD){ bestD = dd; best = i; } });
  go(best);
}
strip.addEventListener("pointerdown", e => {
  dragging = true; strip.setPointerCapture(e.pointerId); pick(e.clientX);
});
strip.addEventListener("pointermove", e => { if(dragging) pick(e.clientX); });
strip.addEventListener("pointerup",   () => dragging = false);
strip.addEventListener("pointercancel",() => dragging = false);

document.addEventListener("keydown", e => {
  /* reference panels scroll normally; only C / Esc (clean view) stay live */
  if(document.body.classList.contains("games-panel") && !["c","escape"].includes(e.key.toLowerCase())) return;
  if(e.key === "Escape"){ if(document.body.classList.contains("clean")) $("cleanBtn").click(); return; }
  if(e.key === "ArrowRight" || e.key === "ArrowDown"){ go(index + 1); e.preventDefault(); }
  else if(e.key === "ArrowLeft" || e.key === "ArrowUp"){ go(index - 1); e.preventDefault(); }
  else if(e.key === "Home"){ go(0); e.preventDefault(); }
  else if(e.key === "End"){ go(list.length - 1); e.preventDefault(); }
  else if(e.key.toLowerCase() === "c"){ $("cleanBtn").click(); }
});

/* drop an image onto a card to set its cover for this session */
function enableDrop(card, d){
  card.addEventListener("dragover", e => { e.preventDefault(); card.classList.add("drop-target"); });
  card.addEventListener("dragleave", () => card.classList.remove("drop-target"));
  card.addEventListener("drop", e => {
    e.preventDefault(); card.classList.remove("drop-target");
    const file = e.dataTransfer.files[0];
    if(!file || !file.type.startsWith("image/")) return;
    COVERS[d.id] = URL.createObjectURL(file);
    const art = card.querySelector(".art");
    art.querySelectorAll("img").forEach(n => n.remove());
    art.insertAdjacentHTML("afterbegin", coverImgs(COVERS[d.id]));
    art.classList.add("has-cover");
    watchFit(art);
  });
}

/* ============================================================
   GAMES — Timeline uses the normal rail; the other tabs are
   reference panels built from GAME_EXTRAS
   ============================================================ */
let gameView = "timeline";

const PANELS = {
  other: () => `
    <h2>Not on the timeline</h2>
    <p class="lede">Titles with no story to place: board and puzzle games, educational software, pinball, crossovers, plug-and-play toys and the smaller mobile and browser games, grouped where there were many.</p>
    <ul class="ref-list">${GAME_EXTRAS.other.map(o =>
      `<li><strong>${o.title}</strong><span>${o.year} · ${o.platforms} · ${o.type}</span></li>`).join("")}</ul>`,
  cancelled: () => `
    <h2>Cancelled</h2>
    <p class="lede">Announced or known to be in development, then shelved.</p>
    <ul class="chips">${GAME_EXTRAS.cancelled.map(c =>
      `<li>${c.title}<span>${c.year}</span></li>`).join("")}</ul>`,
  notes: () => `
    <h2>Notes &amp; sources</h2>
    <ul class="notes-list">
      <li><b>BBY / ABY</b> — games sit on the same timeline and eras as the films, shows and books.</li>
      <li><b>Canon vs. Legends</b> — every game released before April 2014 is Legends, including the film retellings and The Clone Wars tie-ins. LEGO games and later arcade retellings are non-canon.</li>
      <li><b>c.</b> — the placement is approximate or loosely defined. Wookieepedia refused automated requests during research, so these are best mappings — check them before scripting.</li>
      <li><b>Film retelling</b> — the game plays through a film's events rather than telling its own story.</li>
      <li><b>Editing</b> — change sw-games.json, then run <code>python wire_games.py</code>. Covers go in covers/ named game-&lt;id&gt;, then run wire_covers.py.</li>
    </ul>
    <h3>Sources</h3>
    <ol class="sources">${GAME_EXTRAS.sources.map(s =>
      `<li><a href="${s.url}" target="_blank" rel="noopener">${s.label}</a></li>`).join("")}</ol>`
};

function setGameView(v){
  gameView = v;
  [...$("gameNav").children].forEach(x => x.setAttribute("aria-selected", x.dataset.view === v));
  const panel = track === "games" && v !== "timeline";
  document.body.classList.toggle("games-panel", panel);
  if(panel){
    $("gamePanel").innerHTML = `<div class="panel-inner">${PANELS[v]()}</div>`;
    $("gamePanel").scrollTop = 0;
  }
}

$("gameNav").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  setGameView(b.dataset.view);
});
$("gnTimeline").textContent  = GAME_DATA.length;
$("gnOther").textContent     = GAME_EXTRAS.other.length;
$("gnCancelled").textContent = GAME_EXTRAS.cancelled.length;

/* when the page is hosted inside another shell, icon links can land in <body> — browsers only read them in <head> */
document.head.append(...document.querySelectorAll('body link[rel="icon"], body link[rel="apple-touch-icon"]'));

rebuild();
</script>
</body>
